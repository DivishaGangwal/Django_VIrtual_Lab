# Render Blueprint: creates the website + free PostgreSQL database together.
# Render dashboard -> New -> Blueprint -> pick this repository.
databases:
  - name: virtual-lab-db
    plan: free
    region: singapore
    databaseName: virtual_lab
    user: virtual_lab

services:
  - type: web
    name: django-virtual-lab
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: ./build.sh
    startCommand: python -m gunicorn lab_csv_visualizer.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATABASE_URL
        fromDatabase:
          name: virtual-lab-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: WEB_CONCURRENCY
        value: 2
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
