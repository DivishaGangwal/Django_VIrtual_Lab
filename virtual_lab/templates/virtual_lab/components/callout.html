{% comment %}
Reusable Callout / Alert Component
{% endcomment %}
<div class="callout {% if callout_type == 'success' %}callout-success{% elif callout_type == 'warning' %}callout-warning{% endif %}">
  <div class="callout-title">
    {% if callout_type == 'success' %}✓{% elif callout_type == 'warning' %}⚠️{% else %}💡{% endif %}
    {{ callout_title|default:"Laboratory Note" }}
  </div>
  <div class="callout-content">
    {{ callout_text|safe }}
  </div>
</div>
