{% comment %}
Reusable Code Inspector Component
{% endcomment %}
<div class="code-inspector-card">
  <div class="code-inspector-header">
    <div class="code-inspector-title">
      <span>🐍</span> {{ snippet_title|default:"Python Stream Processing Pipeline" }}
    </div>
    <span class="badge badge-primary">Standard Library (Pure Python)</span>
  </div>
  <div class="code-inspector-body">
    <pre><code>{{ snippet_code|safe }}</code></pre>
  </div>
</div>
